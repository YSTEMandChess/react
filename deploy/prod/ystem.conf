#
#  Pure-HTTP reverse proxy for all Y STEM & CHESS services
#  (React UI, Chess Client, Chess Server/API, Middleware, Stockfish)
#

server {
    server_name ystemandchess.com www.ystemandchess.com;

    root /home/azureuser/YSTEMandChess/react/react-ystemandchess/build;
    # try_files $uri /index.html;
    index index.html;

    location /apache/ {
        proxy_pass         http://localhost:8081/;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    #################################################################
    #  React front-end  (localhost:3000)
    ##################################################################
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        # If you build a static bundle later, swap the line above for:
        # try_files $uri /index.html;
    }

    ##################################################################
    #  Chess Client SPA  (localhost:3001)
    ##################################################################
    location /chessclient/ {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    ##################################################################
    #  Chess Server / REST + Socket.IO  (localhost:8000)
    ##################################################################
    location /api/ {
        proxy_pass         http://localhost:3001;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # WebSocket helper (Socket.IO)
    location /socket.io/ {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    ##################################################################
    #  Middleware / Stockfish backend  (localhost:8080)
    ##################################################################
    location /middleware/ {
        rewrite ^/middleware/(.*)$ /$1 break;
        add_header X-CORS-Handled-By-App "true" always;
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
    location /stockfishserver/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    #########################################################################
    #  Lessons static / legacy content  — Apache on localhost:8081   (/lessons/)
    #########################################################################
    location /lessons/ {
        rewrite ^/lessons/(.*)$ /$1 break;   # strip prefix if Apache expects /
        proxy_pass         http://localhost:8081/;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Return 200 for pre-flight OPTIONS instead of 405
    error_page 405 =200 $uri;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ystemandchess.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ystemandchess.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ystemandchess.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = ystemandchess.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name ystemandchess.com www.ystemandchess.com;
    return 404; # managed by Certbot
}
